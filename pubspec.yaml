name: connectsphere
description: "ConnectSphere - Production Social Networking Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  video_player: ^2.8.6
  intl: ^0.19.0
  mime: ^1.0.5
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.1
  firebase_core: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
